spring:
  application:
    name: booking-system

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER}

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO}
    show-sql: ${SHOW_SQL}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # ── Keycloak Resource Server ─────────────────────────────────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/booking-system}

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expirationMs: ${JWT_EXPIRATION_MS}
  refreshExpirationMs: ${JWT_REFRESH_EXPIRATION_MS}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:RAZORPAY_KEY_NOT_SET}
  key-secret: ${RAZORPAY_KEY_SECRET:RAZORPAY_SECRET_NOT_SET}

# ── Dynamic Pricing ───────────────────────────────────────────────────────────
# When disabled (default), the pricing pipeline is a pass-through: seat totals
# equal the base ShowSeat.price and the booking flow is byte-identical to the
# pre-dynamic-pricing behaviour. Flip to `true` only after pricing rules have
# been reviewed in the admin dashboard (/admin/pricing).
pricing:
  dynamic:
    enabled: ${PRICING_DYNAMIC_ENABLED:false}

# ── Keycloak Admin & Migration ────────────────────────────────────────────────
keycloak:
  enabled: ${KEYCLOAK_ENABLED:false}
  admin:
    server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:booking-system}
    client-id: admin-cli
    username: ${KEYCLOAK_ADMIN_USER:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
  migration:
    enabled: ${KEYCLOAK_MIGRATION_ENABLED:false}

# Restrict Spring Boot Actuator to a minimal, safe set of endpoints. Even
# with the Spring Security filter chain in place, explicitly pinning the
# exposed endpoints prevents accidentally shipping /actuator/env,
# /actuator/beans, /actuator/heapdump, etc. if a future config loosens access.
management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: false

# ── Transactional Outbox ─────────────────────────────────────────────────────
outbox:
  poll-interval-ms: 2000
  batch-size: 50
  max-retries: 5

# ── Resilience4j Circuit Breakers & Retries ──────────────────────────────────
resilience4j:
  circuitbreaker:
    instances:
      paymentGateway:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000ms
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      emailService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15000ms
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      paymentGateway:
        max-attempts: 3
        wait-duration: 1000ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
      emailService:
        max-attempts: 3
        wait-duration: 1000ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
